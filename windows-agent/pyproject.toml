[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lifeos-windows-agent"
version = "0.1.0"
description = "Safe, dry-run-only Windows observation and command agent for LifeOS V1"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "psutil>=6,<8",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
  "types-psutil>=7.0,<8",
]

[project.scripts]
lifeos-windows-agent = "lifeos_windows_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lifeos_windows_agent"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lifeos_windows_agent"]
